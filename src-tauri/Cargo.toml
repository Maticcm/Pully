[package]
name = "pully"
version = "0.1.0"
description = "A clean, local media downloader"
authors = ["Pully contributors"]
edition = "2021"
default-run = "pully"
license = "GPL-3.0-or-later"

[lib]
name = "pully_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pully"
path = "src/main.rs"

[[bin]]
name = "pully-native-host"
path = "src/bin/pully-native-host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
