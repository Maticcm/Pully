<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pully</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17V3" /><path d="m6 11 6 6 6-6" /><path d="M19 21H5" />
        </svg>
      </span>
      <span class="wordmark">Pully</span>
    </header>

    <section id="tab-card" class="tab-card">
      <span class="favicon">
        <img id="favicon-img" alt="" hidden />
        <svg id="favicon-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
      </span>
      <span class="tab-text">
        <span id="page-title" class="title">No supported page open</span>
        <span class="meta">
          <span id="page-domain" class="domain"></span>
          <span id="browser-badge" class="badge" hidden></span>
        </span>
      </span>
    </section>

    <div class="actions">
      <button id="quick-btn" class="icon-button" type="button" title="Quick download" aria-label="Quick download" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
      </button>
      <button id="open-btn" class="pill-button" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Download
      </button>
    </div>

    <footer>
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Checking connection…</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
